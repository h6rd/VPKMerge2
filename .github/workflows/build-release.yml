name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'VPKMerge.csproj'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish (Native AOT)
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release
          -r win-x64
          -p:PublishAot=true
          -o publish

      - name: Zip
        run: |
          New-Item -ItemType Directory -Path VPKMerge
          Copy-Item publish\VPKMerge.exe VPKMerge\VPKMerge.exe
          Compress-Archive -Path VPKMerge -DestinationPath VPKMerge-Win.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: VPKMerge-Win.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: publish/VPKMerge.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Native AOT build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish (Native AOT)
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release
          -r linux-x64
          -p:PublishAot=true
          -o publish

      - name: Zip
        run: |
          mkdir -p VPKMerge
          cp publish/VPKMerge VPKMerge/VPKMerge
          chmod +x VPKMerge/VPKMerge
          zip -r VPKMerge-Linux.zip VPKMerge

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: VPKMerge-Linux.zip

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: publish/VPKMerge

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-build

      - uses: actions/download-artifact@v4
        with:
          name: linux-build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            VPKMerge-Win.zip
            VPKMerge-Linux.zip

  publish-binaries:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: binaries

      - uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: binaries

      - name: Make Linux binary executable
        run: chmod +x binaries/VPKMerge

      - name: Commit updated binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add binaries/VPKMerge.exe binaries/VPKMerge
          git commit -m "Update VPKMerge binaries (${{ github.ref_name }})" --allow-empty
          git push origin HEAD:${{ github.event.repository.default_branch }}
